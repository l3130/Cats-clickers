<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Clicker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="cat-clicker.js" defer></script>
</head>
<body>
    <h1>Cat Clicker</h1>
    <div class="main-container">
        <div class="cat-list">
            <h2>Cat List</h2>
            <ul id="cat-names">
                <!-- Cat names will be injected here -->
            </ul>
        </div>

        <div class="cat-display" id="cat-display">
            <!-- Selected cat info will be injected here -->
        </div>
    </div>

    <div class="admin-panel">
        <button id="admin-btn" type="button">Admin</button>
        <div id="admin-area" style="display:none;">
            <h3>Edit Cat</h3>
            <label>
                Name:
                <input id="admin-name" type="text">
            </label>
            <label>
                Image URL:
                <input id="admin-url" type="text">
            </label>
            <label>
                Clicks:
                <input id="admin-clicks" type="number" min="0">
            </label>
            <div class="admin-actions">
                <button id="admin-save" type="button">Save</button>
                <button id="admin-cancel" type="button">Cancel</button>
            </div>
        </div>
    </div>
</body>
</html>
